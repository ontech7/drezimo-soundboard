name: Release

# Builds the Windows installer and the macOS disk image (Apple Silicon), each with the Voicemod key and the updater's
# signature, then publishes both at once in a GitHub release with latest.json, which installed apps read
# (app/src-tauri/tauri.conf.json, plugins.updater). Manual, from main: Actions → Release. The tag is the app's version
# in tauri.conf.json: raise it before.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: What's new, one short line shown by the installed apps
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # A build without them would publish an app that cannot reach Voicemod, or an update nobody can install
      - name: Check the secrets
        env:
          VOICEMOD_CLIENT_KEY: ${{ secrets.VOICEMOD_CLIENT_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for secret in VOICEMOD_CLIENT_KEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!secret}" ] || { echo "::error::the $secret secret is missing"; exit 1; }
          done

      # Published again, a version would change under the apps that already have it
      - name: Check the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::v$version is already released: raise version in app/src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - run: yarn install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VOICEMOD_CLIENT_KEY: ${{ secrets.VOICEMOD_CLIENT_KEY }}
          # The published builds update themselves and start with the system (src-tauri/src/updates.rs)
          DREZIMO_OFFICIAL: "1"
        run: yarn tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - name: Collect the installer
        if: runner.os == 'Windows'
        run: |
          mkdir -p ../dist
          nsis="src-tauri/target/release/bundle/nsis/Drezimo Soundboard_${VERSION}_x64-setup.exe"
          cp "$nsis" "../dist/Drezimo.Soundboard_${VERSION}_x64-setup.exe"
          cp "$nsis.sig" "../dist/Drezimo.Soundboard_${VERSION}_x64-setup.exe.sig"

      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.13"

      # dmgbuild writes Finder's layout itself: Tauri's own disk image loses it on CI
      - name: Make the disk image
        if: runner.os == 'macOS'
        run: |
          pip install dmgbuild==2.0.0
          mkdir -p ../dist
          bundle="src-tauri/target/release/bundle/macos"
          dmgbuild -s src-tauri/macos/dmg.py -D app="$bundle/Drezimo Soundboard.app" "Drezimo Soundboard" \
            "../dist/Drezimo.Soundboard_${VERSION}_aarch64.dmg"
          cp "$bundle/Drezimo Soundboard.app.tar.gz" ../dist/Drezimo.Soundboard_aarch64.app.tar.gz
          cp "$bundle/Drezimo Soundboard.app.tar.gz.sig" ../dist/Drezimo.Soundboard_aarch64.app.tar.gz.sig

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: dist/
          if-no-files-found: error

  # Both platforms at once: an app finds a release only once it has its own update
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The installed apps show what comes before the --- line, once updated (src-tauri/src/news.rs): the rest is for
      # the release page. Without notes there is no line, and nothing to show.
      - name: Write the release text
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          {
            if [ -n "$NOTES" ]; then printf '%s\n\n---\n' "$NOTES"; fi
            echo 'The Windows installer is the `-setup.exe` file, the macOS one (Apple Silicon) the `.dmg` file. Installed apps update themselves.'
          } > notes.md

      # What the installed apps read: the version, the notes, and each platform's package with its signature
      - name: Write latest.json
        run: |
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/v$VERSION"
          windows="Drezimo.Soundboard_${VERSION}_x64-setup.exe"
          macos="Drezimo.Soundboard_aarch64.app.tar.gz"
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg windows_url "$base/$windows" --rawfile windows_sig "dist/$windows.sig" \
            --arg macos_url "$base/$macos" --rawfile macos_sig "dist/$macos.sig" \
            '($windows_sig | rtrimstr("\n")) as $windows_sig | ($macos_sig | rtrimstr("\n")) as $macos_sig
            | {version: $version, notes: $notes, pub_date: $date, platforms: {
              "windows-x86_64": {signature: $windows_sig, url: $windows_url},
              "windows-x86_64-nsis": {signature: $windows_sig, url: $windows_url},
              "darwin-aarch64": {signature: $macos_sig, url: $macos_url},
              "darwin-aarch64-app": {signature: $macos_sig, url: $macos_url}
            }}' > dist/latest.json
          cat dist/latest.json

      - name: Publish
        run: |
          gh release create "v$VERSION" dist/* \
            --title "Drezimo Soundboard $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
