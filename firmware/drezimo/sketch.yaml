profiles:
  rp2040-zero:
    notes: RP2040-Zero (Waveshare or compatible clone)
    # Generic RP2040 instead of the Waveshare board: that one reuses the bootloader's USB ID,
    # and macOS then never brings up the serial port after an upload.
    fqbn: rp2040:rp2040:generic:flash=2097152_0,boot2=boot2_w25q16jvxq_4_padded_checksum,uploadmethod=picotool
    platforms:
      - platform: rp2040:rp2040 (6.3.2)
        platform_index_url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
    libraries:
      - Adafruit NeoPixel (1.15.5)
      - U8g2 (2.36.19)

default_profile: rp2040-zero
