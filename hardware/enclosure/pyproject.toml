[project]
name = "drezimo-case"
version = "0.1.0"
description = "Parametric enclosure generator for the Drezimo soundboard"
requires-python = ">=3.11"
dependencies = ["build123d", "matplotlib"]

[dependency-groups]
dev = [
    "pytest",
    "shapely>=2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
