[package]
name = "drezimo"
version = "1.0.1"
description = "Drezimo Soundboard: the bridge between the board and Voicemod"
authors = ["ontech7"]
license = "MIT"
edition = "2024"

# Desktop only: just the rlib (staticlib and cdylib are for mobile targets)
[lib]
name = "drezimo_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
# Published builds update themselves
tauri-plugin-updater = "2"
# The system's own save and open dialogs, for the configuration file
tauri-plugin-dialog = "2"
# Voicemod's log has local times
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
# The display's language follows the system's
sys-locale = "0.3"
# On the async runtime Tauri already runs: timers and the Voicemod connection
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
# Voicemod listens on a plain ws:// socket on this computer: no TLS
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# The overlay's text
fontdue = "0.9"
# Voicemod sends its pictures as base64
base64 = "0.23"
# The board checks a new firmware against its MD5
md5 = "0.8"

# The overlay draws its own picture (src/overlay/), into a native window
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSGraphics", "NSResponder", "NSScreen", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFData", "objc2"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }
# Voicemod's processes, to find its bridge
libc = "0.2"
# The board's bootloader, written without its drive (src/picoboot.rs)
nusb = "0.2"

# The overlay's window, the drives where the board's firmware is written, the login item and Voicemod's ports
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging"] }
# The text fields' menu in the window, as wry's own WebView2 (src/window.rs)
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
