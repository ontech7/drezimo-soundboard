[package]
name = "drezimo"
version = "0.1.0"
description = "Drezimo Soundboard: the bridge between the board and Voicemod"
authors = ["ontech7"]
edition = "2024"

# Desktop only: just the rlib (staticlib and cdylib are for mobile targets)
[lib]
name = "drezimo_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
# Voicemod's log has local times
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
# On the async runtime Tauri already runs: timers and the Voicemod connection
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
# Voicemod listens on a plain ws:// socket on this computer: no TLS
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
