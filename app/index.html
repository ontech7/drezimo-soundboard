<!doctype html>
<!-- No spelling marks nor autocorrect: macOS would change the sound names typed in the fields -->
<html lang="en" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- Dark from the very first paint, before the stylesheet loads -->
    <style>
      html,
      body {
        background: #0e0e10;
      }
    </style>
    <title>Drezimo Soundboard</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
